name: Update Nidhi pentathlon stats

on:
  schedule:
    # Run every day at 11:00 UTC / 7:00 AM Eastern during daylight saving time.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python3 scripts/scrape_nidhi_stats.py

      - name: Commit updated stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Nidhi pentathlon stats"
          file_pattern: docs/data/nidhi_stats.json
